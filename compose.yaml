# No top-level `name`: the compose project is named after the directory, so
# each git worktree runs its own isolated stack (containers, database,
# volumes) and its own hostname (see docs/local-environment.md).

services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgis/postgis:${POSTGIS_IMAGE_TAG:-16-3.5}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw

  php:
    build:
      context: ./.docker/php
    volumes:
      - .:/var/www
      # Raw Open-Meteo responses, kept out of the repository (see docs/criteria-climate.md).
      - ${OPENMETEO_ARCHIVE_DIR:-${HOME}/pondeo-data/open-meteo}:/var/open-meteo-archive
    environment:
      OPENMETEO_ARCHIVE_DIR: /var/open-meteo-archive
    depends_on:
      - database

  # Dev-only: runs the Vite dev server (HMR) for Symfony Reprise. Not
  # needed in prod, which serves the `npm run build` output as static files.
  node:
    image: node:22-alpine
    working_dir: /var/www
    # Runs as root on a bind mount: umask 000 keeps what it creates (e.g.
    # node_modules) deletable from the host, like the php entrypoint does.
    entrypoint: ["sh", "-c", "umask 000 && exec docker-entrypoint.sh \"$$@\"", "--"]
    volumes:
      - .:/var/www
    environment:
      # The origin the browser loads assets and HMR from (see vite.config.js).
      PONDEO_ORIGIN: https://${COMPOSE_PROJECT_NAME}.pondeo.localhost
    command: sh -c "npm install && npm run dev"

  # Not published on the host: the machine-wide dev proxy (network
  # `dev-proxy`, see docs/local-environment.md) owns ports 80/443, terminates
  # TLS and routes this worktree's hostname here.
  nginx:
    image: nginx:latest
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - database
      - node
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.pondeo.localhost`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
    networks:
      - default
      - dev-proxy
###< doctrine/doctrine-bundle ###

networks:
  # Shared with the dev proxy; created by the machine setup, not by this
  # project.
  dev-proxy:
    external: true

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
