doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # PostGIS ships its own schemas (topology, tiger, tiger_data) that
        # Doctrine doesn't know about — exclude them so schema-diff/migrations
        # don't try to drop them. See jsor/doctrine-postgis docs/symfony.md
        # "Known Problems > PostGIS Schema Exclusion".
        schema_filter: '~^(?!tiger)(?!tiger_data)(?!topology)~'

        # NOTE on `doctrine:schema:validate` / `schema:update --dump-sql`:
        # the GiST spatial indexes (on boundary/centroid/location columns)
        # and the generated `centroid` columns are created by hand in
        # migrations (see migrations/) but ARE properly modeled on the ORM
        # side too — `#[ORM\Index(flags: ['spatial'])]` on the zone/Poi
        # entities, and each `centroid` column's `default` option (see
        # Region::$centroid's docblock).
        #
        # The zone_criterion_value CHECK constraint and its 4 partial unique
        # indexes (see ZoneCriterionValue's docblock) are NOT modelable this
        # way — Doctrine attributes have no equivalent for a CHECK or a
        # partial/filtered index — so `schema:validate` will always report 4
        # "DROP INDEX" diffs for those, permanently. This is why
        # `schema:validate` isn't part of `make sanitize-and-check`'s
        # automated gate: run it manually and compare against this note
        # rather than treating any non-zero exit as a regression.
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
