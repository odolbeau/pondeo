doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # PostGIS ships its own schemas (topology, tiger, tiger_data) that
        # Doctrine doesn't know about — exclude them so schema-diff/migrations
        # don't try to drop them. See jsor/doctrine-postgis docs/symfony.md
        # "Known Problems > PostGIS Schema Exclusion".
        schema_filter: '~^(?!tiger)(?!tiger_data)(?!topology)~'

        # NOTE on `doctrine:schema:validate` / `schema:update --dump-sql`:
        # the GiST spatial indexes (on boundary/centroid/location columns)
        # and the generated `centroid` columns are created by hand in
        # migrations (see migrations/) but ARE properly modeled on the ORM
        # side too — `#[ORM\Index(flags: ['spatial'])]` on the zone/Poi
        # entities, and each `centroid` column's `default` option (see
        # Region::$centroid's docblock) — so schema:validate should report
        # 0 diffs. The zone_criterion_value CHECK constraints, on the other
        # hand, are genuinely invisible to schema:validate either way:
        # DBAL's PostgreSQLSchemaManager doesn't introspect CHECK
        # constraints at all, so they never show up as drift in the first
        # place (nothing to reconcile).
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
