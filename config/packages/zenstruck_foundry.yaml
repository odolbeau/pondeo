when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true
        orm:
            reset:
                # Default SCHEMA mode rebuilds the DB straight from ORM
                # mapping (SchemaTool), bypassing migrations entirely — so
                # it never runs our migration's `CREATE EXTENSION postgis`,
                # and fixture loading fails with "type geometry does not
                # exist". MIGRATE mode runs the real migrations instead.
                # A string, not `!php/enum`: Foundry isn't installed in prod,
                # where the whole file is still parsed.
                mode: migrate

    # If you use the `make:factory --test` command, you may need to uncomment the following.
    # See https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#generate
    #services:
    #    App\Tests\Factory\:
    #        resource: '%kernel.project_dir%/tests/Factory/'
    #        autowire: true
    #        autoconfigure: true

when@test: *dev
