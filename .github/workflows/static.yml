on: [pull_request]
name: Static analysis
jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: PHPStan
        run: vendor/bin/phpstan analyze --no-progress --error-format=checkstyle

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--optimize-autoloader"

      - name: Rector
        run: vendor/bin/rector --dry-run --ansi

  twig-cs-fixer:
    name: Twig CS Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: Twig CS Fixer
        run: vendor/bin/twig-cs-fixer lint

  linters:
    name: 🧹 Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: Lint YAML files
        shell: bash
        run: bin/console lint:yaml config --parse-tags

      - name: Lint Parameters and Services
        shell: bash
        run: bin/console lint:container --no-debug

      - name: Lint Composer config
        shell: bash
        run: composer validate

      - name: Check that PSR is respected
        shell: bash
        run: composer dump-autoload --dev -o --dry-run --strict-psr

  audit:
    name: 🔍 Audit vendors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: Check whether a PHP dependency is compromised
        shell: bash
        run: composer audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front dependencies
        shell: bash
        run: npm ci

      - name: Check whether a front dependency is compromised
        shell: bash
        run: npm audit
