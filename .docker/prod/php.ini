; Production overrides, loaded after .docker/php/custom-config.ini.

; The imports (bin/reset-db) load whole datasets: the dev value (1G) is kept.
memory_limit=1G
expose_php=Off

; The code never changes inside an image.
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600
